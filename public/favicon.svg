<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 배경: 시리즈 amber 옅은 톤 -->
  <rect width="64" height="64" rx="14" fill="#FAEEDA"/>

  <!-- 빵: 두껍게, 라인 강조 -->
  <rect x="6" y="18" width="52" height="28" rx="14" fill="#E8B97A" stroke="#854F0B" stroke-width="2.5"/>

  <!-- 소시지: 굵게, 라인 강조 -->
  <rect x="4" y="24" width="56" height="16" rx="8" fill="#C2410C" stroke="#7C2D12" stroke-width="2"/>

  <!-- 머스타드: 큰 산 2개 -->
  <path d="M 12 33 L 24 26 L 36 33 L 48 26 L 54 30"
        stroke="#FCD34D" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
