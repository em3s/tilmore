<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>스태프 핫도그</title>
<script>
  // 통합 후: 이북은 원문 페이지의 ?view=book 뷰. 옛 /staffhotdog/?book=NN 링크를 그 형태로 리다이렉트.
  (function () {
    var id = new URLSearchParams(location.search).get('book');
    var n = /^0?[1-9]$/.test(id || '') ? ('0' + id).slice(-2) : '01';
    location.replace('/tilmore/staffhotdog/book' + n + '/?view=book');
  })();
</script>
</head>
<body></body>
</html>
