name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Node 20 액션 deprecation 대응 — 모든 JS 액션을 Node 24로 강제(중첩 upload-artifact 포함)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate EPUBs (epubcheck)
        run: |
          VER=5.1.0
          curl -sL -o epubcheck.zip "https://github.com/w3c/epubcheck/releases/download/v${VER}/epubcheck-${VER}.zip"
          unzip -q epubcheck.zip
          fail=0
          for f in dist/staffhotdog/*.epub; do
            echo "::group::epubcheck $(basename "$f")"
            java -jar "epubcheck-${VER}/epubcheck.jar" "$f" || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
